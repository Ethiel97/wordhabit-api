services:
  postgres:
    image: postgres:16
    container_name: wordhabit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wordhabit
    ports:
      - '5432:5432'
    volumes:
      - wordhabit_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: wordhabit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - wordhabit_redis_data:/data

volumes:
  wordhabit_postgres_data:
  wordhabit_redis_data: