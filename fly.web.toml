app = "wordhabit-api"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

  # Shares of a 60-connection role cap, versioned rather than set by
  # hand: worst case is (web + worker) × 2 during a rolling deploy, plus
  # the migration. Web serves requests and takes the larger share.
  DATABASE_POOL_MAX = "15"

  # Public client identifiers, not secrets: they are the audience an
  # identity token must be addressed to, and they already sit in clear
  # text inside the versioned google-services.json. Keeping them here
  # rather than in `fly secrets` makes the deployment reproducible from
  # the repository alone, and reviewable in a diff.
  GOOGLE_CLIENT_IDS = "606640392514-7busd50589763ba56avor7ibj7hp5nh9.apps.googleusercontent.com"
  APPLE_CLIENT_IDS = "com.enthusiastdev.wordhabit"

[processes]
  web = "pnpm run start:prod"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]



[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
